<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>B點手動輸入</title><style>body{margin:0;min-height:100vh;padding:18px;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC','Microsoft JhengHei',sans-serif;background:linear-gradient(155deg,#eff6ff,#dbeafe);display:flex;align-items:center;justify-content:center;color:#123}.app{width:100%;max-width:420px;background:rgba(255,255,255,.94);border-radius:30px;padding:20px;box-shadow:0 18px 45px #1e40af22}.tag{display:inline-block;background:#dbeafe;color:#1d4ed8;border-radius:999px;padding:7px 12px;font-weight:900;font-size:13px}h1{margin:10px 0 14px;font-size:24px}.main{background:#fff;border-radius:28px;text-align:center;padding:22px 12px;margin-bottom:12px}.label{font-size:15px;font-weight:900;color:#64748b}.big{font-size:86px;font-weight:950;line-height:1;color:#1e3a8a}.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.card{background:#fff;border-radius:18px;text-align:center;padding:10px 4px}.ct{font-size:11px;font-weight:900;color:#64748b}.cv{font-size:17px;font-weight:950;margin-top:5px}.box{margin-top:13px;background:#fff;border-radius:26px;padding:16px}.box strong{color:#1d4ed8}.inp{width:100%;height:62px;border:2px solid #bfdbfe;border-radius:20px;text-align:center;font-size:26px;font-weight:950;margin-top:10px}#ticket{font-size:20px}button{width:100%;height:66px;border:0;border-radius:22px;background:linear-gradient(135deg,#60a5fa,#2563eb);color:white;font-size:21px;font-weight:950;margin-top:12px}.note{font-size:14px;font-weight:850;line-height:1.7;color:#475569;background:#eff6ff;border-radius:18px;padding:12px;margin-top:13px}.notice{opacity:0;text-align:center;font-weight:950;color:#1d4ed8;margin:10px}.notice.show{opacity:1}.time{text-align:center;font-size:12px;color:#64748b;font-weight:800}</style></head><body><div class="app"><div class="tag">B點手動輸入</div><h1>後慈湖人數控管</h1><div class="main"><div class="label">目前場內人數</div><div class="big" id="inside">--</div><div class="time" id="updated">讀取中</div></div><div class="cards"><div class="card"><div class="ct">今日入園</div><div class="cv" id="totalIn">--</div></div><div class="card"><div class="ct">A點已離園</div><div class="cv" id="outCount">--</div></div><div class="card"><div class="ct">狀態</div><div class="cv" id="state">待命</div></div></div><div class="notice" id="notice">已完成</div><div class="box"><strong>✍️ B點入園登記</strong><input class="inp" id="people" type="number" inputmode="numeric" min="1" placeholder="輸入人數"><input class="inp" id="ticket" placeholder="票號，可空白"><button onclick="sendIn()">B點入園</button></div><div class="note">老師操作：輸入人數後按「B點入園」。<br>有票號就填票號；沒有票號也可以送出，紀錄會顯示「B點手動入園 / 票號:」。</div></div><script>const GAS_URL="https://script.google.com/macros/s/AKfycbw63eJnsg0a70IbZXBYWktt8CCDfx0mm_MAwzMRDoxKNNvcT2FTTMpJuU8f3qfqHjo/exec";const $=id=>document.getElementById(id);let lock=false;window.onload=getData;function num(v){const x=Number(v);return Number.isFinite(x)?x:null}function pick(d,a){for(const k of a){if(d&&d[k]!==undefined&&d[k]!==""){const x=num(d[k]);if(x!==null)return x}}return null}async function getData(){try{$("state").innerText="同步";const r=await fetch(GAS_URL+"?action=getCount");const d=await r.json();const tin=pick(d,["todayIn","totalIn","in","total"]),tout=pick(d,["todayOut","out","currentOut"]);let ins=pick(d,["inside","currentInside","current","remaining"]);if(ins===null&&tin!==null&&tout!==null)ins=tin-tout;$("totalIn").innerText=tin===null?"--":tin+" 人";$("outCount").innerText=tout===null?"--":tout+" 人";$("inside").innerText=ins===null?"--":ins;$("updated").innerText=new Date().toLocaleTimeString("zh-TW",{hour12:false})+" 更新";$("state").innerText="正常"}catch(e){$("inside").innerText="ERR";$("state").innerText="異常"}}function show(m){const n=$("notice");n.innerText=m;n.classList.add("show");setTimeout(()=>n.classList.remove("show"),2500)}async function sendIn(){if(lock)return;const p=parseInt($("people").value,10);if(!p||p<1){alert("請輸入人數");return}const t=$("ticket").value.trim();const source="B點手動入園 / 票號:"+t;if(!confirm(`確認 B點入園 ${p} 人？\n${source}`))return;lock=true;try{await fetch(GAS_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({type:"IN",action:"bManualIn",delta:p,people:p,location:"B點",source:source,note:source,ticketId:t})});show("B點已登記 "+p+" 人");$("people").value="";$("ticket").value="";setTimeout(getData,850)}catch(e){show("傳送失敗");getData()}setTimeout(()=>lock=false,900)}</script></body></html>
