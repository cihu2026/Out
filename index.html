<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0f766e"><title>A點離園端操作｜後慈湖人數控管</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#102a43;display:flex;justify-content:center;align-items:center;background:linear-gradient(155deg,#eff8ff,#eef8ef 46%,#dbeafe)}.app{width:100%;max-width:414px;padding:20px;border-radius:34px;background:rgba(255,255,255,.88);box-shadow:0 22px 55px rgba(19,47,58,.16)}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.tag{display:inline-block;padding:7px 11px;border-radius:999px;background:rgba(15,118,110,.1);color:#134e4a;font-size:12px;font-weight:900;margin-bottom:8px}h1{margin:0;font-size:22px;font-weight:950}.date{padding:9px 12px;border-radius:18px;background:rgba(255,255,255,.75);font-size:12px;font-weight:850;color:#52616f}.main{border-radius:30px;background:#fff;padding:26px 16px 22px;text-align:center;box-shadow:0 12px 30px rgba(19,47,58,.1);margin-bottom:12px}.label{font-size:15px;font-weight:900;color:#52616f}.numrow{display:flex;align-items:baseline;justify-content:center;gap:7px}.big{font-size:92px;line-height:.95;font-weight:950;letter-spacing:-4px;color:#082f49}.unit{font-size:22px;font-weight:900;color:#475569}.time{font-size:12px;font-weight:750;color:#8a99a5;margin-top:8px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.card{background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);border-radius:20px;text-align:center;padding:12px 7px}.ct{font-size:11px;font-weight:850;color:#6b7c86;margin-bottom:6px}.cv{font-size:18px;font-weight:950;color:#12343f}.notice{min-height:34px;border-radius:999px;background:rgba(34,197,94,.12);color:#166534;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;padding:7px 10px;margin:2px 0 12px;opacity:0;transform:translateY(-5px);transition:.22s}.notice.show{opacity:1;transform:translateY(0)}.box{margin-top:14px;padding:18px 16px;border-radius:30px;background:rgba(255,255,255,.76);border:2px solid rgba(15,118,110,.18);box-shadow:0 12px 28px rgba(15,118,110,.1)}.boxHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.boxHead strong{font-size:16px;color:#134e4a}.boxHead span{font-size:12px;font-weight:900;color:#0f766e;background:rgba(15,118,110,.08);border-radius:999px;padding:5px 9px}input{width:100%;height:66px;border:2px solid rgba(15,118,110,.18);border-radius:22px;text-align:center;font-size:27px;font-weight:900;margin-bottom:12px;background:#fff;color:#102a43;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}button{border:0;border-radius:22px;color:#fff;font-family:inherit;font-size:18px;font-weight:950;min-height:62px;box-shadow:0 10px 20px rgba(19,47,58,.14)}button:active{transform:scale(.98)}button:disabled{opacity:.55}.out{background:linear-gradient(135deg,#34d399,#0f766e)}.back{background:linear-gradient(135deg,#60a5fa,#2563eb)}.teach{margin-top:14px;padding:15px;border-radius:24px;background:rgba(255,255,255,.62);border:1px solid rgba(15,118,110,.16);text-align:left}.teach h2{font-size:17px;margin:0 0 9px;color:#134e4a}.teach ol{margin:0;padding-left:22px;color:#334155;font-size:15px;font-weight:850;line-height:1.85}.teach .warn{margin-top:10px;padding:10px;border-radius:16px;background:rgba(251,191,36,.16);color:#92400e;font-size:14px;font-weight:900;line-height:1.6}.guide{text-align:center;color:#7b8993;font-size:12px;font-weight:750;line-height:1.55;margin-top:12px}.footer{text-align:center;color:#9aa6b2;font-size:11px;font-weight:850;letter-spacing:1.3px;margin-top:10px}@media(max-width:360px){body{padding:12px}.app{padding:16px}.big{font-size:78px}h1{font-size:20px}.teach ol{font-size:14px}}</style></head><body><div class="app"><div class="top"><div><div class="tag">A點離園端操作</div><h1>後慈湖人數控管</h1></div><div class="date" id="today">今日</div></div><div class="main"><div class="label">目前場內人數</div><div class="numrow"><div class="big" id="inside">--</div><div class="unit">人</div></div><div class="time" id="updated">讀取中</div></div><div class="cards"><div class="card"><div class="ct">今日入園</div><div class="cv" id="totalIn">--</div></div><div class="card"><div class="ct">A點已離園</div><div class="cv" id="outCount">--</div></div><div class="card"><div class="ct">狀態</div><div class="cv" id="state">待命</div></div></div><div class="notice" id="notice">已完成</div><div class="box"><div class="boxHead"><strong>✍️ A點人數調整</strong><span>輸入後確認</span></div><input id="custom" type="number" inputmode="numeric" min="1" placeholder="輸入人數"><div class="grid"><button class="out" onclick="sendCustom(true)">離園</button><button class="back" onclick="sendCustom(false)">人數更正</button></div></div><div class="teach"><h2>老師操作說明</h2><ol><li>遊客從 A 點離開：輸入人數，按綠色「離園」。</li><li>剛剛離園登記太多：輸入多登記的人數，按藍色「人數更正」。</li><li>送出前會跳確認視窗，請看清楚人數再確認。</li></ol><div class="warn">簡單記：真的離開按「離園」；剛剛登記太多，才按「人數更正」。</div></div><div class="guide">綠色＝A點離園｜藍色＝扣回錯誤離園紀錄</div><div class="footer">A POINT EXIT CONTROL</div></div><script>const GAS_URL="https://script.google.com/macros/s/AKfycbw63eJnsg0a70IbZXBYWktt8CCDfx0mm_MAwzMRDoxKNNvcT2FTTMpJuU8f3qfqHjo/exec";const $=id=>document.getElementById(id);const inside=$("inside"),totalIn=$("totalIn"),outCount=$("outCount"),state=$("state"),updated=$("updated"),notice=$("notice"),buttons=document.querySelectorAll("button");let locked=false,timer=null;$("today").innerText=new Date().toLocaleDateString("zh-TW",{month:"numeric",day:"numeric",weekday:"short"});window.addEventListener("load",getData);function n(v){const x=Number(v);return Number.isFinite(x)?x:null}function first(d,ks){for(const k of ks){if(d&&d[k]!==undefined&&d[k]!==""){const x=n(d[k]);if(x!==null)return x}}return null}async function getData(){try{state.innerText="同步中";const r=await fetch(GAS_URL+"?action=getCount");const d=await r.json();const tin=first(d,["todayIn","totalIn","in","total","今日總入園人數"]);const tout=first(d,["todayOut","out","current","今日總離園人數"]);let ins=first(d,["inside","currentInside","remaining","當前場內人數"]);if(ins===null&&tin!==null&&tout!==null)ins=tin-tout;totalIn.innerText=tin===null?"--":tin+" 人";outCount.innerText=tout===null?"--":tout+" 人";inside.innerText=ins===null?"--":ins;updated.innerText=new Date().toLocaleTimeString("zh-TW",{hour12:false})+" 更新";state.innerText="正常"}catch(e){inside.innerText="ERR";updated.innerText="讀取失敗";state.innerText="異常";showNotice("讀取失敗",false)}}function showNotice(msg,ok=true){notice.innerText=msg;notice.style.color=ok?"#166534":"#9a3412";notice.style.background=ok?"rgba(34,197,94,.12)":"rgba(251,146,60,.16)";notice.classList.add("show");clearTimeout(timer);timer=setTimeout(()=>notice.classList.remove("show"),2600)}function lock(x){locked=x;buttons.forEach(b=>b.disabled=x)}async function sendDelta(val){if(locked)return;lock(true);const c=Math.abs(val),isOut=val>0;const payload={type:"OUT",action:isOut?"out":"outCorrection",mode:isOut?"leave":"correction",delta:val,outDelta:val,insideDelta:-val,isCorrection:!isOut,countAsOut:isOut,location:"A點",source:isOut?"A點離園端操作":"A點離園端人數更正"};if(!confirm(isOut?`確認 A點離園 ${c} 人？`:`確認 A點人數更正 ${c} 人？`)){lock(false);return}inside.innerText="...";state.innerText="送出中";try{await fetch(GAS_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)});showNotice(isOut?`A點已登記離園 ${c} 人`:`A點已更正 ${c} 人`);setTimeout(getData,850)}catch(e){showNotice("傳送失敗",false);getData()}setTimeout(()=>lock(false),900)}function sendCustom(isAdd){const input=$("custom");const v=parseInt(input.value,10);if(isNaN(v)||v<=0){alert("請輸入正確人數，例如：1、5、10");input.focus();return}sendDelta(isAdd?v:-v);input.value=""}</script></body></html>
