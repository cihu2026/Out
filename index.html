<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>後慈湖人數控管</title>
<style>
:root{--forest:#0f766e;--forest2:#34d399;--lake:#2563eb;--lake2:#60a5fa;--text:#102a43;--muted:#6b7c86;--glass:rgba(255,255,255,.78)}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 16% 8%,rgba(255,255,255,.95),transparent 30%),radial-gradient(circle at 88% 12%,rgba(186,230,253,.92),transparent 32%),linear-gradient(155deg,#eff8ff 0%,#eef8ef 46%,#dbeafe 100%);-webkit-tap-highlight-color:transparent}.app{width:100%;max-width:414px;padding:20px;border-radius:36px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.72));border:1px solid rgba(255,255,255,.85);box-shadow:0 24px 60px rgba(19,47,58,.16);backdrop-filter:blur(22px)}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:15px}.tag{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;background:rgba(15,118,110,.1);color:#134e4a;font-size:12px;font-weight:850;margin-bottom:8px}.tag:before{content:"🌿"}h1{margin:0;font-size:22px;line-height:1.15;font-weight:950;letter-spacing:.2px}.date{padding:9px 12px;border-radius:18px;background:rgba(255,255,255,.72);font-size:12px;font-weight:850;color:#52616f;box-shadow:0 8px 18px rgba(19,47,58,.07)}.main{position:relative;overflow:hidden;border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.86));padding:28px 16px 23px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 14px 34px rgba(19,47,58,.1);margin-bottom:13px}.main:after{content:"";position:absolute;left:-20%;right:-20%;bottom:-55px;height:120px;background:radial-gradient(ellipse at center,rgba(15,118,110,.14),transparent 68%)}.label,.numrow,.time{position:relative;z-index:1}.label{font-size:15px;font-weight:900;color:#52616f;letter-spacing:.6px}.numrow{display:flex;align-items:baseline;justify-content:center;gap:7px;margin-top:2px}.big{font-size:96px;line-height:.94;font-weight:950;letter-spacing:-4px;color:#082f49}.unit{font-size:23px;font-weight:900;color:#475569}.time{font-size:12px;font-weight:750;color:#8a99a5;margin-top:9px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.card{background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.82);border-radius:22px;text-align:center;padding:12px 7px;box-shadow:0 9px 20px rgba(19,47,58,.07)}.ct{font-size:11px;font-weight:850;color:#6b7c86;margin-bottom:6px}.cv{font-size:18px;font-weight:950;color:#12343f}.notice{height:34px;border-radius:999px;background:rgba(34,197,94,.12);color:#166534;font-size:14px;font-weight:850;display:flex;align-items:center;justify-content:center;margin:2px 0 12px;opacity:0;transform:translateY(-5px);transition:.22s}.notice.show{opacity:1;transform:translateY(0)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}button{border:0;min-height:66px;border-radius:24px;color:white;font-family:inherit;font-size:25px;font-weight:950;box-shadow:0 11px 22px rgba(19,47,58,.14);transition:transform .1s ease,opacity .15s ease,box-shadow .1s ease}button span{display:block;margin-top:1px;font-size:12px;font-weight:800;letter-spacing:.6px;opacity:.92}button:active{transform:translateY(2px) scale(.98);box-shadow:0 5px 12px rgba(19,47,58,.12)}button:disabled{opacity:.55}.out{background:linear-gradient(135deg,var(--forest2),var(--forest))}.back{background:linear-gradient(135deg,var(--lake2),var(--lake))}.panel{margin-top:14px;padding:14px;border-radius:28px;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.65)}.ph{display:flex;justify-content:space-between;gap:8px;color:#52616f;font-size:12px;font-weight:850;margin-bottom:10px}input{width:100%;height:56px;border:1px solid rgba(148,163,184,.36);border-radius:20px;text-align:center;font-size:22px;font-weight:900;margin-bottom:11px;background:rgba(255,255,255,.9);color:#102a43;outline:none}input:focus{border-color:rgba(14,165,233,.75);box-shadow:0 0 0 4px rgba(14,165,233,.12);background:#fff}.panel button{min-height:54px;font-size:15px;border-radius:18px}.guide{text-align:center;color:#7b8993;font-size:12px;font-weight:700;line-height:1.55;margin-top:13px}.footer{text-align:center;color:#9aa6b2;font-size:11px;font-weight:850;letter-spacing:1.3px;margin-top:10px}.flash{animation:pop .32s ease}@keyframes pop{50%{transform:scale(1.035)}}@media(max-width:360px){body{padding:12px}.app{padding:16px}.big{font-size:80px}button{font-size:21px;min-height:58px}h1{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><div class="tag">志工登記端</div><h1>後慈湖人數控管</h1></div><div class="date" id="today">今日</div></div>
<div class="main" id="mainBox"><div class="label">目前場內人數</div><div class="numrow"><div class="big" id="inside">--</div><div class="unit">人</div></div><div class="time" id="updated">讀取中</div></div>
<div class="cards"><div class="card"><div class="ct">今日入園</div><div class="cv" id="totalIn">--</div></div><div class="card"><div class="ct">已出園</div><div class="cv" id="outCount">--</div></div><div class="card"><div class="ct">狀態</div><div class="cv" id="state">待命</div></div></div>
<div class="notice" id="notice">已完成</div>
<div class="grid"><button class="out" onclick="sendDelta(5)">+5<span>出園</span></button><button class="out" onclick="sendDelta(1)">+1<span>出園</span></button><button class="back" onclick="sendDelta(-1)">-1<span>返回場內</span></button><button class="back" onclick="sendDelta(-5)">-5<span>返回場內</span></button></div>
<div class="panel"><div class="ph"><div>特殊人數調整</div><div>輸入後再選動作</div></div><input id="custom" type="number" inputmode="numeric" min="1" placeholder="輸入人數"><div class="grid"><button class="out" onclick="sendCustom(true)">登記離園</button><button class="back" onclick="sendCustom(false)">人數更正</button></div></div>
<div class="guide">主畫面看場內人數｜綠色＝出園｜藍色＝返回場內</div><div class="footer">CIHU PEOPLE CONTROL</div>
</div>
<script>
const GAS_URL =
"https://script.google.com/macros/s/AKfycbw63eJnsg0a70IbZXBYWktt8CCDfx0mm_MAwzMRDoxKNNvcT2FTTMpJuU8f3qfqHjo/exec";
const inside=document.getElementById("inside"),totalIn=document.getElementById("totalIn"),outCount=document.getElementById("outCount"),state=document.getElementById("state"),updated=document.getElementById("updated"),notice=document.getElementById("notice"),mainBox=document.getElementById("mainBox"),buttons=document.querySelectorAll("button");
let locked=false,timer=null;
document.getElementById("today").innerText=new Date().toLocaleDateString("zh-TW",{month:"numeric",day:"numeric",weekday:"short"});
window.addEventListener("load",getData);
async function getData(){try{state.innerText="同步中";const r=await fetch(GAS_URL+"?action=getCount");const d=await r.json();showCounts(d);updated.innerText=new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})+" 更新";state.innerText="正常"}catch(e){inside.innerText="ERR";updated.innerText="讀取失敗";state.innerText="異常";showNotice("讀取失敗",false)}}
function n(v){const x=Number(v);return Number.isFinite(x)?x:null}
function first(d,ks){for(const k of ks){if(d&&d[k]!==undefined&&d[k]!==""){const x=n(d[k]);if(x!==null)return x}}return null}
function showCounts(d){const tin=first(d,["todayIn","totalIn","in","total","今日總入園人數"]);const tout=first(d,["todayOut","out","current","今日總離園人數"]);let ins=first(d,["inside","currentInside","remaining","當前場內人數"]);if(ins===null&&tin!==null&&tout!==null)ins=Math.max(tin-tout,0);totalIn.innerText=tin===null?"--":tin+" 人";outCount.innerText=tout===null?"--":tout+" 人";inside.innerText=ins===null?"--":ins}
function showNotice(msg,ok=true){notice.innerText=msg;notice.style.color=ok?"#166534":"#9a3412";notice.style.background=ok?"rgba(34,197,94,.12)":"rgba(251,146,60,.16)";notice.classList.add("show");clearTimeout(timer);timer=setTimeout(()=>notice.classList.remove("show"),2200)}
function lockButtons(x){buttons.forEach(b=>b.disabled=x)}
async function sendDelta(val){if(locked)return;locked=true;lockButtons(true);const c=Math.abs(val),isOut=val>0;if(!confirm(isOut?`確認登記出園 ${c} 人？`:`確認登記返回場內 ${c} 人？`)){locked=false;lockButtons(false);return}if(navigator.vibrate)navigator.vibrate(45);mainBox.classList.add("flash");setTimeout(()=>mainBox.classList.remove("flash"),320);inside.innerText="...";state.innerText="送出中";try{await fetch(GAS_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({type:"OUT",delta:val,source:"離園端操作"})});showNotice(isOut?`已登記出園 ${c} 人`:`已登記返回 ${c} 人`);setTimeout(getData,850)}catch(e){showNotice("傳送失敗",false);getData()}setTimeout(()=>{locked=false;lockButtons(false)},900)}
function sendCustom(isAdd){const input=document.getElementById("custom");const v=parseInt(input.value,10);if(isNaN(v)||v<=0){alert("請輸入正確人數，例如：1、5、10");input.focus();return}sendDelta(isAdd?v:-v);input.value=""}
</script>
</body>
</html>
