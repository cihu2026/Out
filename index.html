<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌅 後慈湖｜離園登記系統</title>

<style>
:root {
  --lake: #0f766e;
  --lake-dark: #115e59;
  --mist: #f4f8f6;
  --water: #e0f2fe;
  --sky: #eef6ff;
  --text: #102a43;
  --muted: #73808c;
  --card: rgba(255,255,255,.82);
  --shadow: 0 22px 55px rgba(15, 42, 67, .16);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.95), transparent 32%),
    radial-gradient(circle at 90% 15%, rgba(186,230,253,.9), transparent 30%),
    linear-gradient(155deg, #eef7ff 0%, #e7f4ec 48%, #dbeafe 100%);
  -webkit-tap-highlight-color: transparent;
}

.container {
  width: 100%;
  max-width: 410px;
  padding: 22px;
  border-radius: 34px;
  background: var(--card);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: var(--shadow);
  border: 1px solid rgba(255,255,255,.72);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.title-wrap { text-align: left; }

h1 {
  margin: 0;
  font-size: 22px;
  line-height: 1.2;
  letter-spacing: .2px;
  font-weight: 900;
}

.subtitle {
  margin-top: 5px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 650;
}

.badge {
  flex: 0 0 auto;
  padding: 8px 11px;
  border-radius: 999px;
  color: var(--lake-dark);
  background: rgba(15,118,110,.1);
  font-size: 12px;
  font-weight: 800;
}

.display {
  position: relative;
  margin: 8px 0 14px;
  padding: 28px 18px 22px;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
  background:
    linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.86)),
    linear-gradient(135deg, var(--water), var(--mist));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    0 12px 30px rgba(15,42,67,.09);
  transition: transform .22s cubic-bezier(.2,.9,.2,1.2);
}

.display::before {
  content: "";
  position: absolute;
  inset: auto -40px -70px -40px;
  height: 130px;
  background: radial-gradient(ellipse at center, rgba(15,118,110,.13), transparent 66%);
}

.count-line {
  position: relative;
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
}

#status {
  font-size: 92px;
  line-height: .95;
  font-weight: 950;
  letter-spacing: -4px;
  color: #0b1f33;
}

.unit {
  font-size: 23px;
  font-weight: 900;
  color: #475569;
}

.display-label {
  position: relative;
  margin-top: 9px;
  color: #52616f;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: .5px;
}

.updated {
  position: relative;
  margin-top: 8px;
  color: #8a96a3;
  font-size: 12px;
  font-weight: 650;
}

.notice {
  height: 34px;
  margin: 4px 0 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 850;
  color: #166534;
  background: rgba(34,197,94,.12);
  opacity: 0;
  transform: translateY(-6px);
  transition: all .22s ease;
}

.notice.show {
  opacity: 1;
  transform: translateY(0);
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 11px;
}

button {
  border: 0;
  min-height: 66px;
  border-radius: 22px;
  color: white;
  cursor: pointer;
  font-family: inherit;
  font-weight: 900;
  font-size: 24px;
  letter-spacing: -.3px;
  box-shadow: 0 10px 20px rgba(15,42,67,.14);
  transition: transform .1s ease, opacity .15s ease, box-shadow .1s ease;
}

button span {
  display: block;
  margin-top: 2px;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: .5px;
  opacity: .9;
}

button:active {
  transform: translateY(2px) scale(.975);
  box-shadow: 0 5px 12px rgba(15,42,67,.12);
}

button:disabled {
  opacity: .58;
  cursor: not-allowed;
}

.out {
  background: linear-gradient(135deg, #34d399, var(--lake));
}

.back {
  background: linear-gradient(135deg, #60a5fa, #2563eb);
}

.custom-card {
  margin-top: 14px;
  padding: 14px;
  border-radius: 26px;
  background: rgba(255,255,255,.58);
  border: 1px solid rgba(255,255,255,.75);
}

.custom-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  color: #52616f;
  font-size: 13px;
  font-weight: 850;
}

input {
  width: 100%;
  height: 56px;
  margin-bottom: 11px;
  border: 1px solid rgba(148,163,184,.35);
  border-radius: 19px;
  outline: none;
  text-align: center;
  font-size: 22px;
  font-weight: 850;
  color: #102a43;
  background: rgba(255,255,255,.86);
  transition: all .2s ease;
}

input:focus {
  border-color: rgba(14,165,233,.75);
  box-shadow: 0 0 0 4px rgba(14,165,233,.12);
  background: #fff;
}

.custom-actions button {
  min-height: 54px;
  font-size: 15px;
  border-radius: 18px;
  letter-spacing: .2px;
}

.hint {
  margin-top: 13px;
  color: #7c8792;
  text-align: center;
  font-size: 12px;
  font-weight: 650;
  line-height: 1.55;
}

.footer {
  margin-top: 12px;
  color: #9aa6b2;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
}

.flash { animation: softPop .32s ease; }

@keyframes softPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.035); }
  100% { transform: scale(1); }
}

@media (max-width: 360px) {
  .container { padding: 18px; }
  h1 { font-size: 20px; }
  #status { font-size: 80px; }
  button { min-height: 60px; font-size: 21px; }
}
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <div class="title-wrap">
      <h1>🌅 後慈湖離園系統</h1>
      <div class="subtitle">離園人數即時登記</div>
    </div>
    <div class="badge">志工端</div>
  </div>

  <div class="display" id="displayBox">
    <div class="count-line">
      <div id="status">⏳</div>
      <div class="unit">人</div>
    </div>
    <div class="display-label">目前已離園</div>
    <div class="updated" id="updatedAt">讀取中</div>
  </div>

  <div class="notice" id="notice">已完成</div>

  <div class="grid">
    <button class="out" onclick="safeSend(5)">+5<span>離園</span></button>
    <button class="out" onclick="safeSend(1)">+1<span>離園</span></button>
    <button class="back" onclick="safeSend(-1)">↩︎1<span>返回</span></button>
    <button class="back" onclick="safeSend(-5)">↩︎5<span>返回</span></button>
  </div>

  <div class="custom-card">
    <div class="custom-head">
      <div>特殊人數</div>
      <div>輸入後選擇離園或返回</div>
    </div>
    <input id="customInput" type="number" inputmode="numeric" min="1" placeholder="輸入人數">
    <div class="grid custom-actions">
      <button class="out" onclick="sendCustom(true)">登記離園</button>
      <button class="back" onclick="sendCustom(false)">登記返回</button>
    </div>
  </div>

  <div class="hint">綠色＝離園增加｜藍色＝返回扣回｜每次送出前會再次確認</div>
  <div class="footer">CIHU OUT SYSTEM</div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbw5VQi-dtLodRQbKTgzueGGXgMBBedA_Th93Skr_Dia3-JYbxtd00shnZ24axbznDY/exec";

const statusEl = document.getElementById("status");
const displayBox = document.getElementById("displayBox");
const noticeEl = document.getElementById("notice");
const updatedAtEl = document.getElementById("updatedAt");
const allButtons = document.querySelectorAll("button");

let locked = false;
let noticeTimer = null;

window.addEventListener("load", fetchCurrent);

async function fetchCurrent(){
  try{
    const res = await fetch(GAS_URL + "?action=getCount");
    const data = await res.json();
    statusEl.innerText = data.current ?? 0;
    updatedAtEl.innerText = formatTime(new Date()) + " 更新";
  }catch{
    statusEl.innerText = "❌";
    updatedAtEl.innerText = "讀取失敗";
    showNotice("讀取失敗，請稍後再試", false);
  }
}

function formatTime(date){
  return date.toLocaleTimeString("zh-TW", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  });
}

function vibrate(){
  if(navigator.vibrate){ navigator.vibrate(45); }
}

function animate(){
  displayBox.classList.add("flash");
  setTimeout(() => displayBox.classList.remove("flash"), 320);
}

function showNotice(message, success = true){
  noticeEl.innerText = message;
  noticeEl.style.background = success ? "rgba(34,197,94,.12)" : "rgba(251,146,60,.16)";
  noticeEl.style.color = success ? "#166534" : "#9a3412";
  noticeEl.classList.add("show");
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => noticeEl.classList.remove("show"), 2200);
}

function setButtonsDisabled(disabled){
  allButtons.forEach(button => button.disabled = disabled);
}

async function safeSend(val){
  if(locked) return;
  locked = true;
  setButtonsDisabled(true);

  const count = Math.abs(val);
  const isOut = val > 0;
  const confirmText = isOut
    ? `確認登記：離園 ${count} 人？`
    : `確認登記：返回 ${count} 人？`;

  if(!confirm(confirmText)){
    locked = false;
    setButtonsDisabled(false);
    return;
  }

  vibrate();
  animate();
  statusEl.innerText = "⏳";
  updatedAtEl.innerText = "送出中";

  try{
    await fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify({
        type: "OUT",
        delta: val,
        source: "離園端操作"
      })
    });

    showNotice(isOut ? `✓ 已登記離園 ${count} 人` : `↩ 已登記返回 ${count} 人`);
    setTimeout(fetchCurrent, 850);

  }catch{
    showNotice("傳送失敗，請再試一次", false);
    fetchCurrent();
  }

  setTimeout(() => {
    locked = false;
    setButtonsDisabled(false);
  }, 900);
}

function sendCustom(isAdd){
  const input = document.getElementById("customInput");
  let val = parseInt(input.value, 10);

  if(isNaN(val) || val <= 0){
    alert("請輸入正確人數，例如：1、5、10");
    input.focus();
    return;
  }

  val = isAdd ? val : -val;
  safeSend(val);
  input.value = "";
}
</script>
</body>
</html>
