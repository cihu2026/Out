<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>後慈湖人數控管</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(160deg,#eef8ff,#edf7ee,#dbeafe);display:flex;align-items:center;justify-content:center;color:#102a43}.app{width:100%;max-width:410px;background:rgba(255,255,255,.86);border-radius:32px;padding:20px;box-shadow:0 20px 50px rgba(19,47,58,.16)}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(15,118,110,.1);color:#134e4a;font-size:12px;font-weight:800;margin-bottom:7px}h1{margin:0;font-size:22px;font-weight:950}.date{padding:9px 11px;border-radius:18px;background:rgba(255,255,255,.75);font-size:12px;font-weight:800;color:#52616f}.main{border-radius:30px;background:#fff;padding:26px 16px 22px;text-align:center;box-shadow:0 12px 30px rgba(19,47,58,.09);margin-bottom:12px}.label{font-size:15px;font-weight:900;color:#52616f;letter-spacing:.5px}.numrow{display:flex;align-items:baseline;justify-content:center;gap:7px}.big{font-size:92px;line-height:.95;font-weight:950;letter-spacing:-4px;color:#082f49}.unit{font-size:23px;font-weight:900;color:#475569}.time{font-size:12px;font-weight:700;color:#8a99a5;margin-top:8px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.card{background:rgba(255,255,255,.7);border-radius:20px;text-align:center;padding:11px 6px;box-shadow:0 8px 18px rgba(19,47,58,.07)}.ct{font-size:11px;font-weight:850;color:#6b7c86;margin-bottom:5px}.cv{font-size:18px;font-weight:950;color:#12343f}.notice{height:32px;border-radius:999px;background:rgba(34,197,94,.12);color:#166534;font-size:14px;font-weight:850;display:flex;align-items:center;justify-content:center;margin:2px 0 11px;opacity:0;transform:translateY(-5px);transition:.2s}.notice.show{opacity:1;transform:translateY(0)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}button{border:0;min-height:64px;border-radius:22px;color:white;font-family:inherit;font-size:25px;font-weight:950;box-shadow:0 10px 20px rgba(19,47,58,.14)}button span{display:block;font-size:12px;font-weight:800;letter-spacing:.5px;opacity:.9}button:active{transform:translateY(2px) scale(.98)}button:disabled{opacity:.55}.out{background:linear-gradient(135deg,#34d399,#0f766e)}.back{background:linear-gradient(135deg,#60a5fa,#2563eb)}.panel{margin-top:13px;padding:13px;border-radius:26px;background:rgba(255,255,255,.58)}.ph{display:flex;justify-content:space-between;color:#52616f;font-size:12px;font-weight:850;margin-bottom:9px}input{width:100%;height:54px;border:1px solid rgba(148,163,184,.36);border-radius:19px;text-align:center;font-size:22px;font-weight:900;margin-bottom:10px;background:rgba(255,255,255,.9)}.panel button{min-height:53px;font-size:15px;border-radius:18px}.guide{text-align:center;color:#7b8993;font-size:12px;font-weight:700;line-height:1.55;margin-top:12px}.flash{animation:pop .32s ease}@keyframes pop{50%{transform:scale(1.035)}}@media(max-width:360px){.big{font-size:78px}button{font-size:21px;min-height:58px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><div class="tag">志工登記端</div><h1>後慈湖人數控管</h1></div><div class="date" id="today">今日</div></div>
<div class="main" id="mainBox"><div class="label">目前場內人數</div><div class="numrow"><div class="big" id="inside">--</div><div class="unit">人</div></div><div class="time" id="updated">讀取中</div></div>
<div class="cards"><div class="card"><div class="ct">今日入園</div><div class="cv" id="totalIn">--</div></div><div class="card"><div class="ct">已出園</div><div class="cv" id="outCount">--</div></div><div class="card"><div class="ct">狀態</div><div class="cv" id="state">待命</div></div></div>
<div class="notice" id="notice">已完成</div>
<div class="grid"><button class="out" onclick="sendDelta(5)">+5<span>出園</span></button><button class="out" onclick="sendDelta(1)">+1<span>出園</span></button><button class="back" onclick="sendDelta(-1)">-1<span>返回場內</span></button><button class="back" onclick="sendDelta(-5)">-5<span>返回場內</span></button></div>
<div class="panel"><div class="ph"><div>特殊人數調整</div><div>輸入後再選動作</div></div><input id="custom" type="number" inputmode="numeric" min="1" placeholder="輸入人數"><div class="grid"><button class="out" onclick="sendCustom(true)">登記出園</button><button class="back" onclick="sendCustom(false)">登記返回</button></div></div>
<div class="guide">主畫面看場內人數｜綠色＝出園｜藍色＝返回場內</div>
</div>
<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbw5VQi-dtLodRQbKTgzueGGXgMBBedA_Th93Skr_Dia3-JYbxtd00shnZ24axbznDY/exec";
const inside=document.getElementById("inside"),totalIn=document.getElementById("totalIn"),outCount=document.getElementById("outCount"),state=document.getElementById("state"),updated=document.getElementById("updated"),notice=document.getElementById("notice"),mainBox=document.getElementById("mainBox"),buttons=document.querySelectorAll("button");
let locked=false,timer=null;
document.getElementById("today").innerText=new Date().toLocaleDateString("zh-TW",{month:"numeric",day:"numeric",weekday:"short"});
window.addEventListener("load",getData);
async function getData(){try{state.innerText="同步中";const r=await fetch(GAS_URL+"?action=getCount");const d=await r.json();showCounts(d);updated.innerText=new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})+" 更新";state.innerText="正常"}catch(e){inside.innerText="ERR";updated.innerText="讀取失敗";state.innerText="異常";showNotice("讀取失敗",false)}}
function n(v){const x=Number(v);return Number.isFinite(x)?x:null}
function first(d,ks){for(const k of ks){if(d&&d[k]!==undefined&&d[k]!==""){const x=n(d[k]);if(x!==null)return x}}return null}
function showCounts(d){const tin=first(d,["todayIn","totalIn","in","total","今日總入園人數"]);const tout=first(d,["todayOut","out","current","今日總離園人數"]);let ins=first(d,["inside","currentInside","remaining","當前場內人數"]);if(ins===null&&tin!==null&&tout!==null)ins=Math.max(tin-tout,0);totalIn.innerText=tin===null?"--":tin+" 人";outCount.innerText=tout===null?"--":tout+" 人";inside.innerText=ins===null?"--":ins}
function showNotice(msg,ok=true){notice.innerText=msg;notice.style.color=ok?"#166534":"#9a3412";notice.style.background=ok?"rgba(34,197,94,.12)":"rgba(251,146,60,.16)";notice.classList.add("show");clearTimeout(timer);timer=setTimeout(()=>notice.classList.remove("show"),2200)}
function lockButtons(x){buttons.forEach(b=>b.disabled=x)}
async function sendDelta(val){if(locked)return;locked=true;lockButtons(true);const c=Math.abs(val),isOut=val>0;if(!confirm(isOut?`確認登記出園 ${c} 人？`:`確認登記返回場內 ${c} 人？`)){locked=false;lockButtons(false);return}if(navigator.vibrate)navigator.vibrate(45);mainBox.classList.add("flash");setTimeout(()=>mainBox.classList.remove("flash"),320);inside.innerText="...";state.innerText="送出中";try{await fetch(GAS_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({type:"OUT",delta:val,source:"離園端操作"})});showNotice(isOut?`已登記出園 ${c} 人`:`已登記返回 ${c} 人`);setTimeout(getData,850)}catch(e){showNotice("傳送失敗",false);getData()}setTimeout(()=>{locked=false;lockButtons(false)},900)}
function sendCustom(isAdd){const input=document.getElementById("custom");const v=parseInt(input.value,10);if(isNaN(v)||v<=0){alert("請輸入正確人數，例如：1、5、10");input.focus();return}sendDelta(isAdd?v:-v);input.value=""}
</script>
</body>
</html>
