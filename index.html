<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌅 後慈湖｜離園登記系統</title>

<style>
:root {
  --bg1: #eaf3ff;
  --bg2: #d8eadf;
  --card: rgba(255, 255, 255, 0.88);
  --text: #1f2d3d;
  --muted: #718096;
  --green1: #22c55e;
  --green2: #15803d;
  --blue1: #38bdf8;
  --blue2: #0369a1;
  --gray1: #94a3b8;
  --gray2: #475569;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px;
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
}

.container {
  width: 100%;
  max-width: 430px;
  padding: 24px 20px;
  border-radius: 30px;
  background: var(--card);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.14);
  border: 1px solid rgba(255,255,255,0.65);
  text-align: center;
}

h1 {
  font-size: 24px;
  margin: 0 0 8px 0;
  font-weight: 900;
  letter-spacing: 0.5px;
}

.subtitle {
  margin-bottom: 16px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
}

.display {
  margin: 16px 0 18px;
  padding: 26px 18px 24px;
  border-radius: 26px;
  background: #fff;
  box-shadow:
    inset 0 2px 8px rgba(0,0,0,0.035),
    0 12px 26px rgba(15,23,42,0.08);
  transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.display-label {
  font-size: 17px;
  font-weight: 900;
  color: #334155;
  margin-bottom: 8px;
}

.count-line {
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 8px;
}

#status {
  font-size: 82px;
  font-weight: 950;
  color: #0f172a;
  line-height: 1;
  letter-spacing: -2px;
}

.unit {
  font-size: 24px;
  font-weight: 900;
  color: #475569;
}

.updated {
  margin-top: 12px;
  font-size: 13px;
  color: var(--muted);
  font-weight: 700;
}

.notice {
  min-height: 34px;
  margin: 4px 0 12px;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(34, 197, 94, 0.12);
  color: #166534;
  font-size: 15px;
  font-weight: 900;
  opacity: 0;
  transform: translateY(-4px);
  transition: all 0.2s ease;
}

.notice.show {
  opacity: 1;
  transform: translateY(0);
}

.section-title {
  margin: 16px 0 10px;
  font-size: 15px;
  color: #334155;
  font-weight: 900;
  text-align: left;
}

.row {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
}

button {
  flex: 1;
  min-height: 60px;
  padding: 14px 8px;
  font-size: 18px;
  border: none;
  border-radius: 18px;
  font-weight: 900;
  color: #fff;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.15s ease;
  box-shadow: 0 6px 14px rgba(15, 23, 42, 0.16);
  display: flex;
  justify-content: center;
  align-items: center;
  line-height: 1.25;
}

button:active {
  transform: translateY(2px) scale(0.97);
  box-shadow: 0 2px 7px rgba(15, 23, 42, 0.16);
}

button:disabled {
  opacity: 0.58;
  cursor: not-allowed;
}

.add,
.addSmall {
  background: linear-gradient(135deg, var(--green1), var(--green2));
}

.back,
.backSmall {
  background: linear-gradient(135deg, var(--blue1), var(--blue2));
}

.custom-box {
  margin-top: 14px;
  padding: 16px;
  border-radius: 22px;
  background: rgba(255,255,255,0.72);
  border: 1px solid rgba(148, 163, 184, 0.25);
}

input {
  width: 100%;
  margin: 2px 0 12px;
  padding: 17px;
  border-radius: 18px;
  border: 2px solid #e2e8f0;
  font-size: 22px;
  text-align: center;
  background: #f8fafc;
  color: #0f172a;
  font-weight: 800;
  transition: all 0.2s ease;
}

input:focus {
  outline: none;
  border-color: #38bdf8;
  background: #fff;
  box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.16);
}

.help {
  margin: 12px 0 0;
  padding: 12px 14px;
  border-radius: 18px;
  background: #f8fafc;
  color: #64748b;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.6;
  text-align: left;
}

.footer {
  margin-top: 16px;
  font-size: 12px;
  color: #94a3b8;
  letter-spacing: 1px;
  font-weight: 700;
}

.flash {
  animation: bounce .3s ease;
}

@keyframes bounce {
  0% { transform: scale(1); }
  50% { transform: scale(1.06); }
  100% { transform: scale(1); }
}

@media (max-width: 360px) {
  h1 { font-size: 21px; }
  #status { font-size: 70px; }
  button { font-size: 16px; min-height: 56px; }
}
</style>
</head>

<body>
<div class="container">

<h1>🌅 後慈湖離園系統</h1>
<div class="subtitle">給志工老師使用｜請依實際人數登記</div>

<div class="display" id="displayBox">
  <div class="display-label">目前已離園</div>
  <div class="count-line">
    <div id="status">⏳</div>
    <div class="unit">人</div>
  </div>
  <div class="updated" id="updatedAt">最後更新：讀取中</div>
</div>

<div class="notice" id="notice">✅ 已完成</div>

<div class="section-title">快速登記</div>
<div class="row">
  <button class="add" onclick="safeSend(5)">🟢 離園<br>5 人</button>
  <button class="addSmall" onclick="safeSend(1)">🟢 離園<br>1 人</button>
</div>

<div class="row">
  <button class="backSmall" onclick="safeSend(-1)">🔵 返回<br>1 人</button>
  <button class="back" onclick="safeSend(-5)">🔵 返回<br>5 人</button>
</div>

<div class="custom-box">
  <div class="section-title" style="margin-top:0;">特殊人數調整</div>
  <input id="customInput" type="number" inputmode="numeric" min="1" placeholder="請輸入人數">
  <div class="row" style="margin-bottom:0;">
    <button class="addSmall" onclick="sendCustom(true)">🟢 登記離園</button>
    <button class="backSmall" onclick="sendCustom(false)">🔵 登記返回</button>
  </div>
</div>

<div class="help">
  ✅ 綠色＝遊客離園，會增加人數<br>
  🔵 藍色＝遊客返回，會扣回人數<br>
  ⚠️ 按下後會再確認一次，避免誤觸
</div>

<div class="footer">志工友善版｜防誤觸｜震動回饋｜最後更新時間</div>

</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbw5VQi-dtLodRQbKTgzueGGXgMBBedA_Th93Skr_Dia3-JYbxtd00shnZ24axbznDY/exec";

const statusEl = document.getElementById("status");
const displayBox = document.getElementById("displayBox");
const noticeEl = document.getElementById("notice");
const updatedAtEl = document.getElementById("updatedAt");
const allButtons = document.querySelectorAll("button");

let locked = false;
let noticeTimer = null;

window.addEventListener("load", fetchCurrent);

async function fetchCurrent(){
  try{
    const res = await fetch(GAS_URL + "?action=getCount");
    const data = await res.json();
    statusEl.innerText = data.current ?? 0;
    updatedAtEl.innerText = "最後更新：" + formatTime(new Date());
  }catch{
    statusEl.innerText = "❌";
    updatedAtEl.innerText = "最後更新：讀取失敗";
    showNotice("⚠️ 讀取失敗，請稍後再試", false);
  }
}

function formatTime(date){
  return date.toLocaleTimeString("zh-TW", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  });
}

function vibrate(){
  if(navigator.vibrate){
    navigator.vibrate(45);
  }
}

function animate(){
  displayBox.classList.add("flash");
  setTimeout(() => displayBox.classList.remove("flash"), 300);
}

function showNotice(message, success = true){
  noticeEl.innerText = message;
  noticeEl.style.background = success ? "rgba(34, 197, 94, 0.12)" : "rgba(251, 146, 60, 0.16)";
  noticeEl.style.color = success ? "#166534" : "#9a3412";
  noticeEl.classList.add("show");

  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => {
    noticeEl.classList.remove("show");
  }, 2200);
}

function setButtonsDisabled(disabled){
  allButtons.forEach(button => button.disabled = disabled);
}

async function safeSend(val){
  if(locked) return;
  locked = true;
  setButtonsDisabled(true);

  const count = Math.abs(val);
  const isOut = val > 0;
  const confirmText = isOut
    ? `確認登記：離園 ${count} 人？`
    : `確認登記：返回 ${count} 人？`;

  if(!confirm(confirmText)){
    locked = false;
    setButtonsDisabled(false);
    return;
  }

  vibrate();
  animate();
  statusEl.innerText = "⏳";
  updatedAtEl.innerText = "最後更新：送出中";

  try{
    await fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify({
        type: "OUT",
        delta: val,
        source: "離園端操作"
      })
    });

    showNotice(isOut ? `✅ 已登記離園 ${count} 人` : `↩️ 已登記返回 ${count} 人`);
    setTimeout(fetchCurrent, 850);

  }catch{
    showNotice("⚠️ 傳送失敗，請再試一次", false);
    fetchCurrent();
  }

  setTimeout(() => {
    locked = false;
    setButtonsDisabled(false);
  }, 900);
}

function sendCustom(isAdd){
  const input = document.getElementById("customInput");
  let val = parseInt(input.value, 10);

  if(isNaN(val) || val <= 0){
    alert("請輸入正確人數，例如：1、5、10");
    input.focus();
    return;
  }

  val = isAdd ? val : -val;
  safeSend(val);
  input.value = "";
}
</script>

</body>
</html>
