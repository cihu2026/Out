<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B點入園</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#dbeafe;margin:0;padding:18px}.app{max-width:420px;margin:auto;background:white;border-radius:28px;padding:20px}h1{margin:0 0 14px;color:#1d4ed8}.num{font-size:70px;font-weight:900;text-align:center;color:#1e3a8a}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{height:60px;border:0;border-radius:18px;font-size:22px;font-weight:900;margin-top:8px;background:#bfdbfe;color:#1d4ed8}.send{width:100%;background:#2563eb;color:white;height:68px}input{width:100%;box-sizing:border-box;height:58px;border:2px solid #bfdbfe;border-radius:18px;text-align:center;font-size:24px;font-weight:900;margin:8px 0}.small{font-size:14px;color:#475569;font-weight:800;line-height:1.6}.top{background:#eff6ff;border-radius:22px;padding:15px;text-align:center;margin-bottom:12px}</style></head><body><div class="app"><h1>B點手動入園</h1><div class="top"><div>目前場內人數</div><div class="num" id="inside">--</div><div id="info">讀取中</div></div><input id="people" type="tel" inputmode="numeric" placeholder="人數"><div class="row"><button onclick="add(1)">+1</button><button onclick="add(5)">+5</button><button onclick="add(10)">+10</button></div><div class="row2"><button onclick="add(-1)">－1</button><button onclick="clr()">清除</button></div><input id="ticket" placeholder="票號，可空白"><button class="send" onclick="send()">B點入園</button><p class="small">沒票號也可以送出，資料會記成：B點手動入園 / 票號:</p></div><script>const U='https://script.google.com/macros/s/AKfycbw63eJnsg0a70IbZXBYWktt8CCDfx0mm_MAwzMRDoxKNNvcT2FTTMpJuU8f3qfqHjo/exec';const $=id=>document.getElementById(id);let L=false;function v(){return parseInt($('people').value||'0',10)||0}function set(n){$('people').value=n>0?n:''}function add(n){set(Math.max(0,v()+n))}function clr(){set(0)}async function load(){try{let r=await fetch(U+'?action=getCount'),d=await r.json();$('inside').innerText=d.current??d.inside??'--';$('info').innerText='已更新'}catch(e){$('info').innerText='讀取失敗'}}async function send(){if(L)return;let p=v();if(p<1){alert('請先按 +1、+5、+10 或輸入人數');return}let t=$('ticket').value.trim(),s='B點手動入園 / 票號:'+t;if(!confirm('確認 B點入園 '+p+' 人？\n'+s))return;L=true;await fetch(U,{method:'POST',mode:'no-cors',body:JSON.stringify({type:'IN',action:'bManualIn',delta:p,people:p,source:s,note:s,ticketId:t})});clr();$('ticket').value='';setTimeout(load,900);setTimeout(()=>L=false,900)}load()</script></body></html>
